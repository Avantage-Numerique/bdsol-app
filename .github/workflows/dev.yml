name: Test packages updates
on:
    pull_request:
        types: [opened, reopened, synchronize]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: npm
            - name: Clean install
              run: npm ci
            - name: Build next
              run: npm run build:debug
